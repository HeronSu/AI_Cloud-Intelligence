<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <!-- 标准灰色箭头 -->
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8578"/>
    </marker>
    <!-- 红色箭头（用于表示多次 I/O） -->
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C8463D"/>
    </marker>
    <!-- 绿色箭头（用于表示高效 I/O） -->
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3A8F5C"/>
    </marker>
    <!-- 柔和阴影 -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- 1. 背景 -->
  <rect x="1" y="1" width="758" height="458" rx="14" fill="#FBFAF6" stroke="#E5E1D8"/>
  
  <!-- 2. 标题 -->
  <text x="24" y="34" font-size="17" font-weight="bold" fill="#2B2B2B">Block 大小与文件读取效率对比</text>
  <text x="24" y="56" font-size="13" fill="#666">以 3KB 文件为例，块大小决定了指针数量与磁盘 I/O 次数</text>
  
  <!-- 中间分隔线 -->
  <path d="M 380 80 L 380 440" stroke="#E5E1D8" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- ==================== 左侧：1KB Block (低效) ==================== -->
  <g id="left">
    <!-- 文件 -->
    <rect x="150" y="90" width="100" height="40" rx="8" fill="#FFFFFF" stroke="#D97757" stroke-width="2" filter="url(#shadow)"/>
    <text x="200" y="115" font-size="14" font-weight="bold" fill="#2B2B2B" text-anchor="middle">File (3KB)</text>
    
    <!-- 文件到 Inode 的连线 -->
    <path d="M 200 130 L 200 152" stroke="#8A8578" stroke-width="2" marker-end="url(#arr)"/>
    
    <!-- Inode -->
    <rect x="120" y="160" width="160" height="80" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="2" filter="url(#shadow)"/>
    <text x="200" y="178" font-size="13" font-weight="bold" fill="#2B2B2B" text-anchor="middle">Inode (元数据)</text>
    
    <!-- 指针底框 -->
    <rect x="130" y="190" width="40" height="16" rx="4" fill="#F1EEE6" />
    <text x="150" y="201" font-size="11" fill="#555" text-anchor="middle">Ptr 1</text>
    <rect x="180" y="190" width="40" height="16" rx="4" fill="#F1EEE6" />
    <text x="200" y="201" font-size="11" fill="#555" text-anchor="middle">Ptr 2</text>
    <rect x="230" y="190" width="40" height="16" rx="4" fill="#F1EEE6" />
    <text x="250" y="201" font-size="11" fill="#555" text-anchor="middle">Ptr 3</text>
    
    <!-- 指针轮流呼吸高亮动效 -->
    <rect x="130" y="190" width="40" height="16" rx="4" fill="#D97757" opacity="0">
      <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0.4;0;0;0;0;0" keyTimes="0;0.1;0.2;0.6;0.8;1"/>
    </rect>
    <rect x="180" y="190" width="40" height="16" rx="4" fill="#D97757" opacity="0">
      <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0;0;0.4;0;0;0" keyTimes="0;0.1;0.2;0.6;0.8;1"/>
    </rect>
    <rect x="230" y="190" width="40" height="16" rx="4" fill="#D97757" opacity="0">
      <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0;0;0;0.4;0;0" keyTimes="0;0.1;0.2;0.6;0.8;1"/>
    </rect>

    <!-- 指针到数据块的连线（红色表示多次 I/O 警告） -->
    <path d="M 150 206 C 150 250, 120 250, 120 305" stroke="#C8463D" stroke-width="2" fill="none" marker-end="url(#arr-red)"/>
    <path d="M 200 206 C 200 250, 190 250, 190 305" stroke="#C8463D" stroke-width="2" fill="none" marker-end="url(#arr-red)"/>
    <path d="M 250 206 C 250 250, 260 250, 260 305" stroke="#C8463D" stroke-width="2" fill="none" marker-end="url(#arr-red)"/>

    <!-- I/O 标签 -->
    <text x="120" y="302" font-size="11" fill="#C8463D" text-anchor="middle" font-weight="bold">I/O 1</text>
    <text x="190" y="302" font-size="11" fill="#C8463D" text-anchor="middle" font-weight="bold">I/O 2</text>
    <text x="260" y="302" font-size="11" fill="#C8463D" text-anchor="middle" font-weight="bold">I/O 3</text>

    <!-- 1KB 数据块 1 -->
    <g>
      <rect x="90" y="310" width="60" height="40" rx="6" fill="#F1EEE6" />
      <!-- 进度填充动效 -->
      <rect x="90" y="310" height="40" rx="6" fill="#D97757" opacity="0.15">
        <animate attributeName="width" dur="1.5s" repeatCount="indefinite" begin="0s" values="0;0;60;60" keyTimes="0;0.8;0.9;1"/>
      </rect>
      <rect x="90" y="310" width="60" height="40" rx="6" fill="none" stroke="#D97757" stroke-width="2" />
      <!-- 读取闪烁动效 -->
      <rect x="90" y="310" width="60" height="40" rx="6" fill="#C8463D" opacity="0">
        <animate attributeName="opacity" dur="1.5s" repeatCount="indefinite" begin="0s" values="0;0;0.3;0" keyTimes="0;0.8;0.9;1"/>
      </rect>
      <text x="120" y="335" font-size="12" fill="#555" text-anchor="middle">1KB</text>
    </g>
    
    <!-- 1KB 数据块 2 -->
    <g>
      <rect x="160" y="310" width="60" height="40" rx="6" fill="#F1EEE6" />
      <rect x="160" y="310" height="40" rx="6" fill="#D97757" opacity="0.15">
        <animate attributeName="width" dur="1.5s" repeatCount="indefinite" begin="0.5s" values="0;0;60;60" keyTimes="0;0.8;0.9;1"/>
      </rect>
      <rect x="160" y="310" width="60" height="40" rx="6" fill="none" stroke="#D97757" stroke-width="2" />
      <rect x="160" y="310" width="60" height="40" rx="6" fill="#C8463D" opacity="0">
        <animate attributeName="opacity" dur="1.5s" repeatCount="indefinite" begin="0.5s" values="0;0;0.3;0" keyTimes="0;0.8;0.9;1"/>
      </rect>
      <text x="190" y="335" font-size="12" fill="#555" text-anchor="middle">1KB</text>
    </g>
    
    <!-- 1KB 数据块 3 -->
    <g>
      <rect x="230" y="310" width="60" height="40" rx="6" fill="#F1EEE6" />
      <rect x="230" y="310" height="40" rx="6" fill="#D97757" opacity="0.15">
        <animate attributeName="width" dur="1.5s" repeatCount="indefinite" begin="1s" values="0;0;60;60" keyTimes="0;0.8;0.9;1"/>
      </rect>
      <rect x="230" y="310" width="60" height="40" rx="6" fill="none" stroke="#D97757" stroke-width="2" />
      <rect x="230" y="310" width="60" height="40" rx="6" fill="#C8463D" opacity="0">
        <animate attributeName="opacity" dur="1.5s" repeatCount="indefinite" begin="1s" values="0;0;0.3;0" keyTimes="0;0.8;0.9;1"/>
      </rect>
      <text x="260" y="335" font-size="12" fill="#555" text-anchor="middle">1KB</text>
    </g>

    <!-- 数据流动小球 -->
    <circle r="6" fill="#C8463D" opacity="0.9">
      <animateMotion dur="1.5s" repeatCount="indefinite" path="M 150 206 C 150 250, 120 250, 120 305"/>
    </circle>
    <circle r="6" fill="#C8463D" opacity="0.9">
      <animateMotion dur="1.5s" repeatCount="indefinite" begin="0.5s" path="M 200 206 C 200 250, 190 250, 190 305"/>
    </circle>
    <circle r="6" fill="#C8463D" opacity="0.9">
      <animateMotion dur="1.5s" repeatCount="indefinite" begin="1s" path="M 250 206 C 250 250, 260 250, 260 305"/>
    </circle>
    
    <!-- 底部总结 -->
    <text x="190" y="385" font-size="14" font-weight="bold" fill="#C8463D" text-anchor="middle">3 次磁盘 I/O（低效）</text>
    <text x="190" y="405" font-size="12" fill="#666" text-anchor="middle">指针数量多，需要多次寻址与读取</text>
  </g>
  
  <!-- ==================== 右侧：4KB Block (高效) ==================== -->
  <g id="right">
    <!-- 文件 -->
    <rect x="520" y="90" width="100" height="40" rx="8" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="2" filter="url(#shadow)"/>
    <text x="570" y="115" font-size="14" font-weight="bold" fill="#2B2B2B" text-anchor="middle">File (3KB)</text>
    
    <!-- 文件到 Inode 的连线 -->
    <path d="M 570 130 L 570 152" stroke="#8A8578" stroke-width="2" marker-end="url(#arr)"/>
    
    <!-- Inode -->
    <rect x="500" y="160" width="140" height="80" rx="10" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="2" filter="url(#shadow)"/>
    <text x="570" y="178" font-size="13" font-weight="bold" fill="#2B2B2B" text-anchor="middle">Inode (元数据)</text>
    
    <!-- 指针底框 -->
    <rect x="540" y="190" width="60" height="16" rx="4" fill="#F1EEE6" />
    <text x="570" y="201" font-size="11" fill="#555" text-anchor="middle">Ptr 1</text>
    
    <!-- 指针高亮动效 -->
    <rect x="540" y="190" width="60" height="16" rx="4" fill="#3D6FB6" opacity="0">
      <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0.4;0;0;0" keyTimes="0;0.2;0.5;1"/>
    </rect>

    <!-- 指针到数据块的连线（绿色表示单次高效 I/O） -->
    <path d="M 570 206 C 570 250, 560 250, 560 305" stroke="#3A8F5C" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>

    <!-- I/O 标签 -->
    <text x="560" y="302" font-size="11" fill="#3A8F5C" text-anchor="middle" font-weight="bold">I/O 1</text>

    <!-- 4KB 数据块 -->
    <g>
      <rect x="500" y="310" width="120" height="40" rx="6" fill="#F1EEE6" />
      <!-- 进度填充动效（文件 3KB / 块 4KB = 75% 宽度） -->
      <rect x="500" y="310" height="40" rx="6" fill="#3D6FB6" opacity="0.15">
        <animate attributeName="width" dur="1.5s" repeatCount="indefinite" begin="0s" values="0;0;90;90" keyTimes="0;0.8;0.9;1"/>
      </rect>
      <rect x="500" y="310" width="120" height="40" rx="6" fill="none" stroke="#3D6FB6" stroke-width="2" />
      <!-- 读取闪烁动效 -->
      <rect x="500" y="310" width="120" height="40" rx="6" fill="#3A8F5C" opacity="0">
        <animate attributeName="opacity" dur="1.5s" repeatCount="indefinite" begin="0s" values="0;0;0.3;0" keyTimes="0;0.8;0.9;1"/>
      </rect>
      <text x="560" y="325" font-size="12" fill="#555" text-anchor="middle">4KB Block</text>
      <text x="560" y="340" font-size="11" fill="#888" text-anchor="middle">Used: 3KB</text>
    </g>

    <!-- 数据流动小球 -->
    <circle r="6" fill="#3A8F5C" opacity="0.9">
      <animateMotion dur="1.5s" repeatCount="indefinite" path="M 570 206 C 570 250, 560 250, 560 305"/>
    </circle>

    <!-- 底部总结 -->
    <text x="570" y="385" font-size="14" font-weight="bold" fill="#3A8F5C" text-anchor="middle">1 次磁盘 I/O（高效）</text>
    <text x="570" y="405" font-size="12" fill="#666" text-anchor="middle">指针数量少，一次性读取整个数据块</text>
  </g>
</svg>