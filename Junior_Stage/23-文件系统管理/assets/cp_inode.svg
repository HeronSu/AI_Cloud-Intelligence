<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <!-- 标准灰色箭头 -->
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8578"/>
    </marker>
    <!-- 蓝色箭头（用于数据复制流向） -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D6FB6"/>
    </marker>
    <!-- 柔和阴影 -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- 1. 背景 -->
  <rect x="1" y="1" width="758" height="458" rx="14" fill="#FBFAF6" stroke="#E5E1D8"/>
  
  <!-- 2. 标题 -->
  <text x="24" y="34" font-size="17" font-weight="bold" fill="#2B2B2B">cp 命令底层原理：分配新 Inode 与真实数据拷贝</text>
  <text x="24" y="56" font-size="13" fill="#666">即使在同一文件系统，cp 也需要分配独立的空间并完整复制数据</text>
  
  <!-- ==================== 左侧：源文件 (Source) ==================== -->
  <g id="left">
    <!-- 背景块（缩小宽度，留出中间空间） -->
    <rect x="20" y="80" width="280" height="330" rx="12" fill="#F1EEE6" opacity="0.5"/>
    <text x="35" y="105" font-size="13" font-weight="bold" fill="#9A9284">Source (源文件)</text>
    
    <!-- 源文件名 -->
    <rect x="95" y="125" width="130" height="50" rx="8" fill="#FFFFFF" stroke="#D97757" stroke-width="2" filter="url(#shadow)"/>
    <text x="160" y="145" font-size="13" font-weight="bold" fill="#2B2B2B" text-anchor="middle">/root/test.txt</text>
    <text x="160" y="161" font-size="11" fill="#888" text-anchor="middle">原文件</text>
    
    <!-- 连接到 Inode -->
    <path d="M 160 175 L 160 215" stroke="#8A8578" stroke-width="2" marker-end="url(#arr)"/>
    
    <!-- 源 Inode -->
    <rect x="95" y="220" width="130" height="60" rx="8" fill="#FFFFFF" stroke="#D97757" stroke-width="2" filter="url(#shadow)"/>
    <text x="160" y="240" font-size="13" font-weight="bold" fill="#D97757" text-anchor="middle">Inode</text>
    <text x="160" y="258" font-size="11" fill="#666" text-anchor="middle">100670075</text>
    
    <!-- 连接到 Block -->
    <path d="M 160 280 L 160 315" stroke="#8A8578" stroke-width="2" marker-end="url(#arr)"/>
    
    <!-- 源数据块 -->
    <rect x="85" y="320" width="150" height="70" rx="8" fill="#FFFFFF" stroke="#D97757" stroke-width="2" filter="url(#shadow)"/>
    <text x="160" y="345" font-size="14" font-weight="bold" fill="#2B2B2B" text-anchor="middle">Data Blocks</text>
    <text x="160" y="365" font-size="12" fill="#555" text-anchor="middle">10G 源数据</text>
  </g>
  
  <!-- ==================== 右侧：目标文件 (Copy) ==================== -->
  <g id="right">
    <!-- 背景块（缩小宽度） -->
    <rect x="460" y="80" width="280" height="330" rx="12" fill="#F4EFE6" opacity="0.5"/>
    <text x="475" y="105" font-size="13" font-weight="bold" fill="#9A9284">Destination (新文件)</text>
    
    <!-- 新文件名 -->
    <rect x="535" y="125" width="130" height="50" rx="8" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="2" filter="url(#shadow)"/>
    <text x="600" y="145" font-size="13" font-weight="bold" fill="#2B2B2B" text-anchor="middle">/opt/test_copy.txt</text>
    <text x="600" y="161" font-size="11" fill="#888" text-anchor="middle">新文件名</text>
    
    <!-- 连接到新 Inode -->
    <path d="M 600 175 L 600 215" stroke="#8A8578" stroke-width="2" marker-end="url(#arr)"/>
    
    <!-- 新 Inode -->
    <rect x="535" y="220" width="130" height="60" rx="8" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="2" filter="url(#shadow)"/>
    <text x="600" y="240" font-size="13" font-weight="bold" fill="#3D6FB6" text-anchor="middle">New Inode</text>
    <text x="600" y="258" font-size="11" fill="#666" text-anchor="middle">200987654</text>
    
    <!-- 新 Inode 分配高亮动效 -->
    <rect x="535" y="220" width="130" height="60" rx="8" fill="#3D6FB6" opacity="0">
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0.3;0;0;0;0" keyTimes="0;0.1;0.3;0.6;0.8;1"/>
    </rect>
    
    <!-- 连接到新 Block -->
    <path d="M 600 280 L 600 315" stroke="#8A8578" stroke-width="2" marker-end="url(#arr)"/>
    
    <!-- 新数据块 -->
    <rect x="525" y="320" width="150" height="70" rx="8" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="2" filter="url(#shadow)"/>
    <text x="600" y="345" font-size="14" font-weight="bold" fill="#2B2B2B" text-anchor="middle">New Blocks</text>
    <text x="600" y="365" font-size="12" fill="#555" text-anchor="middle">分配的 10G 空间</text>
    
    <!-- 新数据块填充动效（模拟数据逐渐写入） -->
    <rect x="525" y="320" height="70" rx="8" fill="#3D6FB6" opacity="0.15">
      <animate attributeName="width" dur="3s" repeatCount="indefinite" values="0;0;150;150" keyTimes="0;0.1;0.9;1"/>
    </rect>
  </g>

  <!-- ==================== 中间：cp 动作与数据流 ==================== -->
  <g id="center">
    <!-- cp 命令指示（拉长，确保左侧可见） -->
    <path d="M 305 150 L 455 150" stroke="#8A8578" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="340" y="130" width="80" height="24" rx="4" fill="#FBFAF6" stroke="#8A8578" stroke-width="1"/>
    <text x="380" y="146" font-size="13" font-weight="bold" fill="#3D6FB6" text-anchor="middle">cp 命令</text>
    
    <!-- 数据复制流（从源 Block 到新 Block） -->
    <path d="M 230 355 L 520 355" stroke="#3D6FB6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-blue)"/>
    <text x="380" y="345" font-size="12" font-weight="bold" fill="#3D6FB6" text-anchor="middle">拷贝数据 (I/O 操作)</text>
    
    <!-- 复制过程的小球动画 (从源流向目标) -->
    <circle r="6" fill="#3D6FB6" opacity="0.9">
      <animateMotion dur="3s" repeatCount="indefinite" path="M 230 355 L 520 355"/>
    </circle>
    <circle r="6" fill="#D97757" opacity="0.9">
      <animateMotion dur="3s" repeatCount="indefinite" begin="1.5s" path="M 230 355 L 520 355"/>
    </circle>
  </g>

  <!-- ==================== 底部说明 ==================== -->
  <g id="bottom">
    <rect x="150" y="410" width="460" height="30" rx="6" fill="#FBFAF6" stroke="#D9D3C7" stroke-width="1" filter="url(#shadow)"/>
    <text x="380" y="430" font-size="13" font-weight="bold" fill="#C8463D" text-anchor="middle">速度较慢（取决于文件大小）｜ 分配新 Inode 并真实复制 10G 数据</text>
  </g>
</svg>