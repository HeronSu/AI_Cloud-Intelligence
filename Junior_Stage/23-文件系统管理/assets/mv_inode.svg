<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <!-- 标准灰色箭头 -->
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8578"/>
    </marker>
    <!-- 红色箭头（用于跨文件系统复制，略带沉重感） -->
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C8463D"/>
    </marker>
    <!-- 柔和阴影 -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- 1. 背景 -->
  <rect x="1" y="1" width="758" height="478" rx="14" fill="#FBFAF6" stroke="#E5E1D8"/>
  
  <!-- 2. 标题 -->
  <text x="24" y="34" font-size="17" font-weight="bold" fill="#2B2B2B">mv 命令在不同文件系统下的底层原理</text>
  <text x="24" y="56" font-size="13" fill="#666">同一分区：极速移动（仅改映射） vs 跨分区：数据复制（重建 inode）</text>
  
  <!-- 中间分隔线 -->
  <path d="M 380 80 L 380 460" stroke="#E5E1D8" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- ==================== 左侧：同一文件系统内 mv ==================== -->
  <g id="left">
    <!-- 大的文件系统框 -->
    <rect x="20" y="85" width="340" height="370" rx="12" fill="#F1EEE6" opacity="0.5"/>
    <text x="35" y="110" font-size="13" font-weight="bold" fill="#9A9284">Filesystem A (e.g., 根分区 /)</text>
    
    <!-- 源目录卡片 -->
    <rect x="40" y="130" width="130" height="50" rx="8" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="2" filter="url(#shadow)"/>
    <text x="105" y="150" font-size="13" font-weight="bold" fill="#2B2B2B" text-anchor="middle">/root/test.txt</text>
    <text x="105" y="166" font-size="11" fill="#888" text-anchor="middle">原文件名</text>
    
    <!-- 目标目录卡片 -->
    <rect x="210" y="130" width="130" height="50" rx="8" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="2" filter="url(#shadow)"/>
    <text x="275" y="150" font-size="13" font-weight="bold" fill="#2B2B2B" text-anchor="middle">/opt/test.txt</text>
    <text x="275" y="166" font-size="11" fill="#888" text-anchor="middle">新文件名</text>

    <!-- 移动指示线 -->
    <path d="M 170 155 L 205 155" stroke="#3A8F5C" stroke-width="2" marker-end="url(#arr)"/>
    <text x="187" y="148" font-size="11" fill="#3A8F5C" text-anchor="middle" font-weight="bold">mv</text>
    
    <!-- 共享的 Inode -->
    <rect x="110" y="230" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#D97757" stroke-width="2" filter="url(#shadow)"/>
    <text x="190" y="250" font-size="13" font-weight="bold" fill="#D97757" text-anchor="middle">Inode (100670075)</text>
    <text x="190" y="270" font-size="11" fill="#666" text-anchor="middle">属性不变，链接数不变</text>
    
    <!-- 连接线 -->
    <path d="M 105 180 L 105 210 L 150 230" stroke="#8A8578" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 275 180 L 275 210 L 230 230" stroke="#8A8578" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    
    <!-- Inode 到 Block 的连线 -->
    <path d="M 190 290 L 190 330" stroke="#8A8578" stroke-width="2" marker-end="url(#arr)"/>
    
    <!-- 共享的数据 Block -->
    <rect x="100" y="340" width="180" height="70" rx="8" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="2" filter="url(#shadow)"/>
    <text x="190" y="365" font-size="14" font-weight="bold" fill="#2B2B2B" text-anchor="middle">Data Blocks (10G)</text>
    <text x="190" y="385" font-size="11" fill="#666" text-anchor="middle">底层物理位置不改变</text>

    <!-- 动效：文件名映射更新的高亮与小球 -->
    <rect x="40" y="130" width="130" height="50" rx="8" fill="#3A8F5C" opacity="0">
      <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0;0.2;0;0;0" keyTimes="0;0.1;0.3;0.6;1"/>
    </rect>
    <rect x="210" y="130" width="130" height="50" rx="8" fill="#3A8F5C" opacity="0">
      <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0;0;0.2;0;0" keyTimes="0;0.1;0.3;0.6;1"/>
    </rect>
    <!-- 极速移动的小球 -->
    <circle r="5" fill="#3A8F5C">
      <animateMotion dur="1s" repeatCount="indefinite" path="M 170 155 L 205 155"/>
    </circle>
    
    <!-- 底部说明 -->
    <text x="190" y="435" font-size="14" font-weight="bold" fill="#3A8F5C" text-anchor="middle">极速完成（秒级）</text>
    <text x="190" y="450" font-size="11" fill="#666" text-anchor="middle">只更改目录项映射关系</text>
  </g>
  
  <!-- ==================== 右侧：跨文件系统 mv ==================== -->
  <g id="right">
    <!-- 文件系统 A 框 -->
    <rect x="395" y="85" width="165" height="370" rx="12" fill="#F1EEE6" opacity="0.5"/>
    <text x="410" y="110" font-size="13" font-weight="bold" fill="#9A9284">Filesystem A</text>
    
    <!-- 文件系统 B 框 -->
    <rect x="575" y="85" width="165" height="370" rx="12" fill="#F4EFE6" opacity="0.5"/>
    <text x="590" y="110" font-size="13" font-weight="bold" fill="#9A9284">Filesystem B</text>
    
    <!-- 源文件 A -->
    <rect x="412" y="130" width="130" height="50" rx="8" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="2" filter="url(#shadow)"/>
    <text x="477" y="150" font-size="13" font-weight="bold" fill="#2B2B2B" text-anchor="middle">/root/test.txt</text>
    
    <!-- 目标文件 B -->
    <rect x="592" y="130" width="130" height="50" rx="8" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="2" filter="url(#shadow)"/>
    <text x="657" y="150" font-size="13" font-weight="bold" fill="#2B2B2B" text-anchor="middle">/mnt/test.txt</text>

    <!-- 跨FS移动指示线（粗一点，红色，表示繁琐） -->
    <path d="M 542 155 L 587 155" stroke="#C8463D" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arr-red)"/>
    <text x="564" y="148" font-size="11" fill="#C8463D" text-anchor="middle" font-weight="bold">mv</text>
    
    <!-- Inode A -->
    <rect x="412" y="220" width="130" height="50" rx="8" fill="#FFFFFF" stroke="#D97757" stroke-width="2" filter="url(#shadow)"/>
    <text x="477" y="240" font-size="12" font-weight="bold" fill="#D97757" text-anchor="middle">Inode A (100670075)</text>
    <text x="477" y="255" font-size="11" fill="#666" text-anchor="middle">最终被删除</text>
    
    <!-- Inode B -->
    <rect x="592" y="220" width="130" height="50" rx="8" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="2" filter="url(#shadow)"/>
    <text x="657" y="240" font-size="12" font-weight="bold" fill="#3D6FB6" text-anchor="middle">Inode B (200123456)</text>
    <text x="657" y="255" font-size="11" fill="#666" text-anchor="middle">重新分配</text>
    
    <!-- 连接线 -->
    <path d="M 477 180 L 477 220" stroke="#8A8578" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 657 180 L 657 220" stroke="#8A8578" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Inode 到 Block 的连线 -->
    <path d="M 477 270 L 477 310" stroke="#8A8578" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 657 270 L 657 310" stroke="#8A8578" stroke-width="2" marker-end="url(#arr)"/>
    
    <!-- Block A -->
    <rect x="412" y="320" width="130" height="60" rx="8" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="2" filter="url(#shadow)"/>
    <text x="477" y="345" font-size="13" font-weight="bold" fill="#2B2B2B" text-anchor="middle">Data Blocks (10G)</text>
    <text x="477" y="362" font-size="11" fill="#666" text-anchor="middle">源数据</text>
    
    <!-- Block B -->
    <rect x="592" y="320" width="130" height="60" rx="8" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="2" filter="url(#shadow)"/>
    <text x="657" y="345" font-size="13" font-weight="bold" fill="#2B2B2B" text-anchor="middle">New Data (10G)</text>
    <text x="657" y="362" font-size="11" fill="#666" text-anchor="middle">复制产生</text>

    <!-- 跨块数据复制动效（虚线大箭头） -->
    <path d="M 542 350 L 587 350" stroke="#C8463D" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-red)"/>
    <text x="564" y="340" font-size="11" fill="#C8463D" text-anchor="middle">复制</text>
    
    <!-- 复制小球（慢速） -->
    <circle r="6" fill="#C8463D" opacity="0.8">
      <animateMotion dur="3s" repeatCount="indefinite" path="M 542 350 L 587 350"/>
    </circle>

    <!-- 删除 A 的动效（淡出高亮） -->
    <rect x="412" y="130" width="130" height="50" rx="8" fill="#C8463D" opacity="0">
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0;0;0;0.3;0;0" keyTimes="0;0.1;0.3;0.6;0.7;0.8;1"/>
    </rect>
    <rect x="412" y="220" width="130" height="50" rx="8" fill="#C8463D" opacity="0">
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0;0;0;0.3;0;0" keyTimes="0;0.1;0.3;0.6;0.7;0.8;1"/>
    </rect>
    <text x="477" y="410" font-size="11" fill="#C8463D" text-anchor="middle" opacity="0">
      删除源文件
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0;0;0;1;0;0" keyTimes="0;0.1;0.3;0.6;0.7;0.8;1"/>
    </text>

    <!-- 底部说明 -->
    <text x="567" y="435" font-size="14" font-weight="bold" fill="#C8463D" text-anchor="middle">速度缓慢（取决于文件大小）</text>
    <text x="567" y="450" font-size="11" fill="#666" text-anchor="middle">涉及大量数据复制与新老文件删除</text>
  </g>
</svg>