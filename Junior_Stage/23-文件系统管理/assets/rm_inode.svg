<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <!-- 标准灰色箭头 -->
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8578"/>
    </marker>
    <!-- 蓝色箭头 -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D6FB6"/>
    </marker>
    <!-- 红色箭头 -->
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C8463D"/>
    </marker>
    <!-- 柔和阴影 -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- 1. 全局背景 -->
  <rect x="1" y="1" width="798" height="458" rx="14" fill="#FBFAF6" stroke="#E5E1D8"/>
  
  <!-- 2. 标题 -->
  <text x="24" y="34" font-size="17" font-weight="bold" fill="#2B2B2B">rm 命令底层原理：映射解除与数据覆盖</text>
  <text x="24" y="56" font-size="13" fill="#666">rm 并未立刻清空数据，而是解除目录项链接，底层 Block 变为空闲，等待被新数据覆写</text>
  
  <!-- 面板分隔线 -->
  <path d="M 260 80 L 260 440" stroke="#E5E1D8" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 520 80 L 520 440" stroke="#E5E1D8" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- ==================== 面板 1：正常状态 ==================== -->
  <g id="panel1">
    <text x="130" y="105" font-size="13" font-weight="bold" fill="#9A9284" text-anchor="middle">① 正常状态</text>
    
    <!-- 文件名 -->
    <rect x="70" y="130" width="120" height="40" rx="6" fill="#FFFFFF" stroke="#D97757" stroke-width="2" filter="url(#shadow)"/>
    <text x="130" y="155" font-size="13" font-weight="bold" fill="#2B2B2B" text-anchor="middle">filename.txt</text>
    
    <!-- 映射关系线 -->
    <path d="M 130 170 L 130 220" stroke="#8A8578" stroke-width="2" marker-end="url(#arr)"/>
    <text x="145" y="200" font-size="11" fill="#666">映射</text>
    
    <!-- Inode -->
    <rect x="70" y="230" width="120" height="50" rx="6" fill="#FFFFFF" stroke="#D97757" stroke-width="2" filter="url(#shadow)"/>
    <text x="130" y="260" font-size="13" font-weight="bold" fill="#D97757" text-anchor="middle">Inode #1234</text>
    
    <!-- 指针线 -->
    <path d="M 130 280 L 130 320" stroke="#8A8578" stroke-width="2" marker-end="url(#arr)"/>
    
    <!-- 数据块 -->
    <rect x="60" y="330" width="140" height="70" rx="6" fill="#F1EEE6" stroke="#D9D3C7" stroke-width="2" filter="url(#shadow)"/>
    <text x="130" y="360" font-size="13" font-weight="bold" fill="#2B2B2B" text-anchor="middle">Block 数据</text>
    <text x="130" y="380" font-size="11" fill="#555" text-anchor="middle">(原数据 "Data A")</text>
  </g>

  <!-- ==================== 面板 2：执行 rm 后 ==================== -->
  <g id="panel2">
    <text x="390" y="105" font-size="13" font-weight="bold" fill="#9A9284" text-anchor="middle">② 执行 rm 后</text>
    
    <!-- 文件名消失（虚线框） -->
    <rect x="330" y="130" width="120" height="40" rx="6" fill="none" stroke="#C8463D" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="390" y="155" font-size="12" fill="#C8463D" text-anchor="middle">已删除</text>
    
    <!-- 映射关系断开（变红并打叉） -->
    <path d="M 390 170 L 390 190" stroke="#C8463D" stroke-width="2" stroke-dasharray="4 2"/>
    <!-- 叉号 -->
    <path d="M 380 185 L 400 205 M 400 185 L 380 205" stroke="#C8463D" stroke-width="2"/>
    <animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="1;0.3;1" keyTimes="0;0.5;1"/>
    
    <!-- Inode 变为空闲 -->
    <rect x="330" y="230" width="120" height="50" rx="6" fill="#FFFFFF" stroke="#9A9284" stroke-width="2" stroke-dasharray="4 2" filter="url(#shadow)"/>
    <text x="390" y="260" font-size="13" font-weight="bold" fill="#9A9284" text-anchor="middle">Inode #1234</text>
    
    <!-- 指针保留但变为灰色 -->
    <path d="M 390 280 L 390 320" stroke="#9A9284" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arr)"/>
    
    <!-- Block 标记为空闲 -->
    <rect x="320" y="330" width="140" height="70" rx="6" fill="#FFFFFF" stroke="#9A9284" stroke-width="2" stroke-dasharray="4 2" filter="url(#shadow)"/>
    <text x="390" y="360" font-size="13" font-weight="bold" fill="#9A9284" text-anchor="middle">Block 空闲</text>
    <text x="390" y="380" font-size="11" fill="#9A9284" text-anchor="middle">(原数据依然存在)</text>
    
    <!-- 呼吸高亮动画（表示等待分配） -->
    <rect x="320" y="330" width="140" height="70" rx="6" fill="#9A9284" opacity="0">
      <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0;0.15;0" keyTimes="0;0.5;1"/>
    </rect>
  </g>

  <!-- ==================== 面板 3：新文件写入 ==================== -->
  <g id="panel3">
    <text x="660" y="105" font-size="13" font-weight="bold" fill="#9A9284" text-anchor="middle">③ 新文件继承并覆盖</text>
    
    <!-- 新文件名 -->
    <rect x="600" y="130" width="120" height="40" rx="6" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="2" filter="url(#shadow)"/>
    <text x="660" y="155" font-size="13" font-weight="bold" fill="#2B2B2B" text-anchor="middle">newfile.txt</text>
    
    <!-- 新映射关系线 -->
    <path d="M 660 170 L 660 220" stroke="#3D6FB6" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text x="675" y="200" font-size="11" fill="#3D6FB6">新映射</text>
    
    <!-- 复用 Inode -->
    <rect x="600" y="230" width="120" height="50" rx="6" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="2" filter="url(#shadow)"/>
    <text x="660" y="260" font-size="13" font-weight="bold" fill="#3D6FB6" text-anchor="middle">Inode #1234</text>
    
    <!-- 指针线 -->
    <path d="M 660 280 L 660 320" stroke="#3D6FB6" stroke-width="2" marker-end="url(#arr-blue)"/>
    
    <!-- 数据块被覆写 -->
    <rect x="590" y="330" width="140" height="70" rx="6" fill="#F1EEE6" stroke="#3D6FB6" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- 新数据写入动画 -->
    <rect x="590" y="330" width="140" height="70" rx="6" fill="#3D6FB6" opacity="0.2">
      <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0.2;0;0.2" keyTimes="0;0.5;1"/>
    </rect>
    
    <text x="660" y="360" font-size="13" font-weight="bold" fill="#3D6FB6" text-anchor="middle">Block 数据</text>
    <text x="660" y="380" font-size="11" fill="#C8463D" text-anchor="middle" font-weight="bold">
      (旧数据被覆盖)
      <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="1;0;1" keyTimes="0;0.5;1"/>
    </text>
    
    <!-- 数据写入小球动画 -->
    <circle r="4" fill="#3D6FB6">
      <animateMotion dur="2s" repeatCount="indefinite" path="M 660 280 L 660 330"/>
    </circle>
  </g>
</svg>