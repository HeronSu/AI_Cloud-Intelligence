<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 780" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <!-- 背景板 -->
  <rect x="1" y="1" width="838" height="778" rx="14" fill="#FBFAF6" stroke="#E5E1D8"/>

  <!-- 全局标题 -->
  <text x="24" y="34" font-size="18" font-weight="bold" fill="#2B2B2B">ROW (Redirect-On-Write) 快照删除与合并逻辑</text>
  <text x="24" y="56" font-size="13" fill="#666">完整演示删除标记 ➜ 数据流向 ➜ 目标扩容 ➜ 彻底清理残留</text>

  <!-- 标记定义 -->
  <defs>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8578"/>
    </marker>
  </defs>

  <!-- ==================== 场景 1：删除 snap01 ==================== -->
  <g transform="translate(20, 80)">
    <rect x="0" y="0" width="800" height="150" rx="10" fill="#F4EFE6" fill-opacity="0.3" stroke="#E5E1D8" stroke-width="1"/>

    <text x="20" y="30" font-size="14" font-weight="bold" fill="#3D6FB6">场景 1：删除 snap01，增量数据合并至基础磁盘</text>
    <text x="680" y="30" font-size="14" font-weight="bold" fill="#555">
      <tspan>初始状态</tspan>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="10s" repeatCount="indefinite" />
    </text>
    <text x="680" y="30" font-size="14" font-weight="bold" fill="#3A8F5C" opacity="0">
      <tspan>结果状态</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.5;0.9;1" dur="10s" repeatCount="indefinite" />
    </text>

    <!-- 基础磁盘 (变宽) -->
    <rect x="40" y="70" width="140" height="50" rx="6" fill="#3D6FB6" fill-opacity="0.2" stroke="#3D6FB6" stroke-width="2">
      <animate attributeName="width" values="140;140;140;280;280;140" keyTimes="0;0.35;0.5;0.65;0.9;1" dur="10s" repeatCount="indefinite" />
    </rect>
    <!-- 初始文字 -->
    <text x="110" y="100" font-size="14" font-weight="bold" fill="#3D6FB6" text-anchor="middle" opacity="1">
      <tspan>基础磁盘 (5G)</tspan>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.55;0.65;0.9;1" dur="10s" repeatCount="indefinite" />
    </text>
    <!-- 合并后文字 -->
    <text x="180" y="100" font-size="14" font-weight="bold" fill="#2B2B2B" text-anchor="middle" opacity="0">
      <tspan>基础磁盘 (5G) + snap01 数据</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.65;0.72;0.9;1" dur="10s" repeatCount="indefinite" />
    </text>

    <!-- snap01 (就地彻底淡出，不移动) -->
    <g>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.6;0.9;1" dur="10s" repeatCount="indefinite" />
      <rect x="220" y="70" width="140" height="50" rx="6" fill="#3A8F5C" fill-opacity="0.2" stroke="#3A8F5C" stroke-width="2"/>
      <text x="290" y="100" font-size="14" font-weight="bold" fill="#3A8F5C" text-anchor="middle">snap01 (1G)</text>

      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.55;0.62;1" dur="10s" repeatCount="indefinite" />
        <path d="M 260 80 L 320 110 M 320 80 L 260 110" stroke="#C8463D" stroke-width="4" stroke-linecap="round" />
      </g>
    </g>

    <!-- snap02 (未被删除，全程静止不动) -->
    <rect x="400" y="70" width="140" height="50" rx="6" fill="#D97757" fill-opacity="0.2" stroke="#D97757" stroke-width="2"/>
    <text x="470" y="100" font-size="14" font-weight="bold" fill="#D97757" text-anchor="middle">snap02 (2G)</text>

    <!-- 初始连线 (snap01 删除后消失) -->
    <g>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.62;0.9;1" dur="10s" repeatCount="indefinite" />
      <path d="M 180 95 L 215 95" stroke="#8A8578" stroke-width="2" marker-end="url(#arr-grey)" />
      <path d="M 360 95 L 395 95" stroke="#8A8578" stroke-width="2" marker-end="url(#arr-grey)" />
    </g>

    <!-- 合并后新连线：从扩容后的基础磁盘直接指向 snap02 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.62;0.68;0.9;1" dur="10s" repeatCount="indefinite" />
      <path d="M 320 95 L 395 95" stroke="#8A8578" stroke-width="2" marker-end="url(#arr-grey)" />
    </g>

    <!-- 数据小球：snap01 ➜ 基础磁盘 -->
    <circle r="6" fill="#3A8F5C">
      <animateMotion dur="10s" keyTimes="0;0.3;0.55;0.62;1" values="290,95; 290,95; 110,95; 110,95; 290,95" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0;0;0" keyTimes="0;0.25;0.55;0.62;0.66;1" dur="10s" repeatCount="indefinite" />
    </circle>
  </g>


  <!-- ==================== 场景 2：删除 snap02 ==================== -->
  <g transform="translate(20, 250)">
    <rect x="0" y="0" width="800" height="150" rx="10" fill="#F4EFE6" fill-opacity="0.3" stroke="#E5E1D8" stroke-width="1"/>

    <text x="20" y="30" font-size="14" font-weight="bold" fill="#D97757">场景 2：删除 snap02，增量数据合并至 snap01</text>
    <text x="680" y="30" font-size="14" font-weight="bold" fill="#555">
      <tspan>初始状态</tspan>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="10s" repeatCount="indefinite" />
    </text>
    <text x="680" y="30" font-size="14" font-weight="bold" fill="#3A8F5C" opacity="0">
      <tspan>结果状态</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.5;0.9;1" dur="10s" repeatCount="indefinite" />
    </text>

    <rect x="40" y="70" width="140" height="50" rx="6" fill="#3D6FB6" fill-opacity="0.2" stroke="#3D6FB6" stroke-width="2"/>
    <text x="110" y="100" font-size="14" font-weight="bold" fill="#3D6FB6" text-anchor="middle">基础磁盘 (5G)</text>

    <!-- snap01 (变宽吸收 snap02，自身位置不动) -->
    <rect x="220" y="70" width="140" height="50" rx="6" fill="#3A8F5C" fill-opacity="0.2" stroke="#3A8F5C" stroke-width="2">
      <animate attributeName="width" values="140;140;140;280;280;140" keyTimes="0;0.35;0.5;0.65;0.9;1" dur="10s" repeatCount="indefinite" />
    </rect>
    <text x="290" y="100" font-size="14" font-weight="bold" fill="#3A8F5C" text-anchor="middle" opacity="1">
      <tspan>snap01 (1G)</tspan>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.6;0.9;1" dur="10s" repeatCount="indefinite" />
    </text>
    <text x="360" y="100" font-size="14" font-weight="bold" fill="#2B2B2B" text-anchor="middle" opacity="0">
      <tspan>snap01 (1G) + snap02 数据</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.65;0.72;0.9;1" dur="10s" repeatCount="indefinite" />
    </text>

    <!-- snap02 (就地彻底淡出，不移动不缩放) -->
    <g>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.62;0.9;1" dur="10s" repeatCount="indefinite" />
      <rect x="400" y="70" width="140" height="50" rx="6" fill="#D97757" fill-opacity="0.2" stroke="#D97757" stroke-width="2"/>
      <text x="470" y="100" font-size="14" font-weight="bold" fill="#D97757" text-anchor="middle">snap02 (2G)</text>

      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.55;0.62;1" dur="10s" repeatCount="indefinite" />
        <path d="M 440 80 L 500 110 M 500 80 L 440 110" stroke="#C8463D" stroke-width="4" stroke-linecap="round" />
      </g>
    </g>

    <!-- 基础磁盘 ➜ snap01：指向幸存的 snap01，全程保留 -->
    <path d="M 180 95 L 215 95" stroke="#8A8578" stroke-width="2" marker-end="url(#arr-grey)" />
    <!-- snap01 ➜ snap02：snap02 被删后一并消失 -->
    <path d="M 360 95 L 395 95" stroke="#8A8578" stroke-width="2" marker-end="url(#arr-grey)" opacity="1">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.62;0.9;1" dur="10s" repeatCount="indefinite" />
    </path>

    <!-- 数据小球：snap02 ➜ snap01 -->
    <circle r="6" fill="#D97757">
      <animateMotion dur="10s" keyTimes="0;0.3;0.55;0.62;1" values="470,95; 470,95; 360,95; 360,95; 470,95" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0;0;0" keyTimes="0;0.25;0.55;0.62;0.66;1" dur="10s" repeatCount="indefinite" />
    </circle>
  </g>


  <!-- ==================== 场景 3：回滚至 snap01 后删除 snap02 ==================== -->
  <g transform="translate(20, 420)">
    <rect x="0" y="0" width="800" height="150" rx="10" fill="#F4EFE6" fill-opacity="0.3" stroke="#E5E1D8" stroke-width="1"/>

    <text x="20" y="30" font-size="14" font-weight="bold" fill="#8A6BB8">场景 3：回滚至 snap01，再删除 snap02 (不合并，直接丢弃)</text>
    <text x="680" y="30" font-size="14" font-weight="bold" fill="#555">
      <tspan>初始状态</tspan>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="10s" repeatCount="indefinite" />
    </text>
    <text x="680" y="30" font-size="14" font-weight="bold" fill="#8A6BB8" opacity="0">
      <tspan>结果状态</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.5;0.9;1" dur="10s" repeatCount="indefinite" />
    </text>

    <rect x="40" y="70" width="140" height="50" rx="6" fill="#3D6FB6" fill-opacity="0.2" stroke="#3D6FB6" stroke-width="2"/>
    <text x="110" y="100" font-size="14" font-weight="bold" fill="#3D6FB6" text-anchor="middle">基础磁盘 (5G)</text>

    <!-- snap01 (回滚目标，全程静止) -->
    <rect x="220" y="70" width="140" height="50" rx="6" fill="#3A8F5C" fill-opacity="0.2" stroke="#3A8F5C" stroke-width="2"/>
    <text x="290" y="100" font-size="14" font-weight="bold" fill="#3A8F5C" text-anchor="middle">snap01 (1G)</text>

    <!-- 回滚高亮框：从 snap02 移动到 snap01，之后淡出 -->
    <rect x="400" y="70" width="140" height="50" rx="6" fill="none" stroke="#D97757" stroke-width="3" stroke-dasharray="6 4" opacity="1">
      <animate attributeName="x" values="400;400;220;220;400" keyTimes="0;0.3;0.42;0.9;1" dur="10s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.78;0.9;1" dur="10s" repeatCount="indefinite" />
    </rect>

    <!-- snap02 (就地彻底淡出：移除错误的 scale 动画，不再向左上角飞) -->
    <g>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.6;0.72;0.9;1" dur="10s" repeatCount="indefinite" />
      <rect x="400" y="70" width="140" height="50" rx="6" fill="#D97757" fill-opacity="0.2" stroke="#D97757" stroke-width="2"/>
      <text x="470" y="100" font-size="14" font-weight="bold" fill="#D97757" text-anchor="middle">snap02 (2G)</text>

      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.6;0.68;1" dur="10s" repeatCount="indefinite" />
        <path d="M 440 80 L 500 110 M 500 80 L 440 110" stroke="#C8463D" stroke-width="4" stroke-linecap="round" />
      </g>
    </g>

    <!-- 基础磁盘 ➜ snap01：指向回滚后幸存的 snap01，全程保留 -->
    <path d="M 180 95 L 215 95" stroke="#8A8578" stroke-width="2" marker-end="url(#arr-grey)" />
    <!-- snap01 ➜ snap02：snap02 被删后消失 -->
    <path d="M 360 95 L 395 95" stroke="#8A8578" stroke-width="2" marker-end="url(#arr-grey)" opacity="1">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.6;0.72;0.9;1" dur="10s" repeatCount="indefinite" />
    </path>
  </g>


  <!-- ==================== 场景 4：依序删除全部快照 ==================== -->
  <g transform="translate(20, 590)">
    <rect x="0" y="0" width="800" height="150" rx="10" fill="#F4EFE6" fill-opacity="0.3" stroke="#E5E1D8" stroke-width="1"/>

    <text x="20" y="30" font-size="14" font-weight="bold" fill="#2B2B2B">场景 4：依序删除所有快照 (先删 snap01，再删 snap02)</text>
    <text x="680" y="30" font-size="14" font-weight="bold" fill="#555">
      <tspan>初始状态</tspan>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="10s" repeatCount="indefinite" />
    </text>
    <text x="680" y="30" font-size="14" font-weight="bold" fill="#3D6FB6" opacity="0">
      <tspan>结果状态</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.5;0.9;1" dur="10s" repeatCount="indefinite" />
    </text>

    <!-- 基础磁盘 (分两轮变宽) -->
    <rect x="40" y="70" width="140" height="50" rx="6" fill="#3D6FB6" fill-opacity="0.2" stroke="#3D6FB6" stroke-width="2">
      <animate attributeName="width" values="140;140;140;280;280;420;420;140" keyTimes="0;0.2;0.3;0.45;0.55;0.7;0.9;1" dur="10s" repeatCount="indefinite" />
    </rect>
    <!-- 初始文字 -->
    <text x="110" y="100" font-size="14" font-weight="bold" fill="#3D6FB6" text-anchor="middle" opacity="1">
      <tspan>基础磁盘 (5G)</tspan>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.3;0.4;0.9;1" dur="10s" repeatCount="indefinite" />
    </text>
    <!-- 中间态文字：吸收 snap01 后 -->
    <text x="180" y="100" font-size="14" font-weight="bold" fill="#2B2B2B" text-anchor="middle" opacity="0">
      <tspan>基础磁盘 + snap01</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.5;0.62;0.68;1" dur="10s" repeatCount="indefinite" />
    </text>
    <!-- 最终文字 -->
    <text x="250" y="100" font-size="14" font-weight="bold" fill="#2B2B2B" text-anchor="middle" opacity="0">
      <tspan>基础磁盘 + snap01 + snap02</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.72;0.78;0.9;1" dur="10s" repeatCount="indefinite" />
    </text>

    <!-- snap01 (先被删：就地彻底淡出，不动) -->
    <g>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.35;0.45;0.9;1" dur="10s" repeatCount="indefinite" />
      <rect x="220" y="70" width="140" height="50" rx="6" fill="#3A8F5C" fill-opacity="0.2" stroke="#3A8F5C" stroke-width="2"/>
      <text x="290" y="100" font-size="14" font-weight="bold" fill="#3A8F5C" text-anchor="middle">snap01 (1G)</text>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.35;0.42;1" dur="10s" repeatCount="indefinite" />
        <path d="M 260 80 L 320 110 M 320 80 L 260 110" stroke="#C8463D" stroke-width="4" stroke-linecap="round" />
      </g>
    </g>

    <!-- snap02 (后被删：全程静止，不再左移填位) -->
    <g>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.6;0.72;0.9;1" dur="10s" repeatCount="indefinite" />
      <rect x="400" y="70" width="140" height="50" rx="6" fill="#D97757" fill-opacity="0.2" stroke="#D97757" stroke-width="2"/>
      <text x="470" y="100" font-size="14" font-weight="bold" fill="#D97757" text-anchor="middle">snap02 (2G)</text>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.55;0.68;1" dur="10s" repeatCount="indefinite" />
        <path d="M 440 80 L 500 110 M 500 80 L 440 110" stroke="#C8463D" stroke-width="4" stroke-linecap="round" />
      </g>
    </g>

    <!-- 连线 1：基础磁盘 ➜ snap01，snap01 删除后消失 -->
    <path d="M 180 95 L 215 95" stroke="#8A8578" stroke-width="2" marker-end="url(#arr-grey)" opacity="1">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.35;0.45;0.9;1" dur="10s" repeatCount="indefinite" />
    </path>
    <!-- 连线 2：扩容后的基础磁盘 ➜ 尚存的 snap02 -->
    <path d="M 320 95 L 395 95" stroke="#8A8578" stroke-width="2" marker-end="url(#arr-grey)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.52;0.6;0.68;1" dur="10s" repeatCount="indefinite" />
    </path>

    <!-- 数据球 1：snap01 ➜ 基础磁盘 -->
    <circle r="6" fill="#3A8F5C">
      <animateMotion dur="10s" keyTimes="0;0.2;0.45;0.5;1" values="290,95; 290,95; 110,95; 110,95; 290,95" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0;0;0" keyTimes="0;0.12;0.45;0.5;0.55;1" dur="10s" repeatCount="indefinite" />
    </circle>

    <!-- 数据球 2：snap02 ➜ 基础磁盘 -->
    <circle r="6" fill="#D97757">
      <animateMotion dur="10s" keyTimes="0;0.5;0.68;0.72;1" values="470,95; 470,95; 250,95; 250,95; 470,95" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.5;0.68;0.72;1" dur="10s" repeatCount="indefinite" />
    </circle>
  </g>

</svg>