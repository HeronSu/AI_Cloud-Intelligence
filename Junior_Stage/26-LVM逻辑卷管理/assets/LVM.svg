<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <!-- 背景板 -->
  <rect x="1" y="1" width="758" height="518" rx="14" fill="#FBFAF6" stroke="#E5E1D8"/>
  
  <!-- 标题 -->
  <text x="24" y="34" font-size="17" font-weight="bold" fill="#2B2B2B">LVM (Logical Volume Manager) 架构</text>

  <!-- ==================== 1. LV (Logical Volume) / 逻辑卷 ==================== -->
  <text x="24" y="95" font-size="14" font-weight="bold" fill="#3A8F5C">LV (Logical Volume)</text>
  <text x="24" y="115" font-size="13" fill="#555">逻辑卷</text>

  <!-- LV 块 (2个) -->
  <rect x="300" y="70" width="140" height="60" rx="6" fill="#FFFFFF" stroke="#3A8F5C" stroke-width="2"/>
  <text x="370" y="95" font-size="15" font-weight="bold" fill="#3A8F5C" text-anchor="middle">LV_root</text>
  <text x="370" y="115" font-size="11" fill="#666" text-anchor="middle">(文件系统)</text>
  
  <rect x="500" y="70" width="140" height="60" rx="6" fill="#FFFFFF" stroke="#3A8F5C" stroke-width="2"/>
  <text x="570" y="95" font-size="15" font-weight="bold" fill="#3A8F5C" text-anchor="middle">LV_home</text>
  <text x="570" y="115" font-size="11" fill="#666" text-anchor="middle">(文件系统)</text>


  <!-- ==================== 2. VG (Volume Group) / 卷组 ==================== -->
  <text x="24" y="220" font-size="14" font-weight="bold" fill="#D97757">VG (Volume Group)</text>
  <text x="24" y="240" font-size="13" fill="#555">卷组</text>

  <!-- VG 大框 -->
  <rect x="260" y="190" width="420" height="70" rx="8" fill="#FFF9F5" stroke="#D97757" stroke-width="2"/>
  <text x="470" y="210" font-size="13" font-weight="bold" fill="#D97757" text-anchor="middle">Volume Group (VG)</text>
  
  <!-- VG 内部 PE 示意 -->
  <rect x="280" y="220" width="120" height="30" rx="4" fill="#FFFFFF" stroke="#D97757" stroke-width="1"/>
  <text x="340" y="240" font-size="12" fill="#555" text-anchor="middle">PV1 (PEs)</text>
  
  <rect x="410" y="220" width="120" height="30" rx="4" fill="#FFFFFF" stroke="#D97757" stroke-width="1"/>
  <text x="470" y="240" font-size="12" fill="#555" text-anchor="middle">PV2 (PEs)</text>

  <rect x="540" y="220" width="120" height="30" rx="4" fill="#FFFFFF" stroke="#D97757" stroke-width="1"/>
  <text x="600" y="240" font-size="12" fill="#555" text-anchor="middle">PV3 (PEs)</text>


  <!-- ==================== 3. PV (Physical Volume) / 物理卷 ==================== -->
  <text x="24" y="345" font-size="14" font-weight="bold" fill="#3D6FB6">PV (Physical Volume)</text>
  <text x="24" y="365" font-size="13" fill="#555">物理卷</text>

  <!-- PV 块 (3个) -->
  <rect x="280" y="320" width="120" height="60" rx="6" fill="#F4EFE6" stroke="#3D6FB6" stroke-width="2"/>
  <text x="340" y="355" font-size="15" font-weight="bold" fill="#3D6FB6" text-anchor="middle">PV 1</text>
  
  <rect x="410" y="320" width="120" height="60" rx="6" fill="#F4EFE6" stroke="#3D6FB6" stroke-width="2"/>
  <text x="470" y="355" font-size="15" font-weight="bold" fill="#3D6FB6" text-anchor="middle">PV 2</text>

  <rect x="540" y="320" width="120" height="60" rx="6" fill="#F4EFE6" stroke="#3D6FB6" stroke-width="2"/>
  <text x="600" y="355" font-size="15" font-weight="bold" fill="#3D6FB6" text-anchor="middle">PV 3</text>


  <!-- ==================== 4. PP (Physical Partition) / 物理分区 ==================== -->
  <text x="24" y="465" font-size="14" font-weight="bold" fill="#555">PP (Physical Partition)</text>
  <text x="24" y="485" font-size="13" fill="#555">物理分区</text>

  <!-- PP 块 (3个) -->
  <rect x="280" y="440" width="120" height="60" rx="6" fill="#FFFFFF" stroke="#B9B2A3" stroke-width="2"/>
  <text x="340" y="470" font-size="14" font-weight="bold" fill="#555" text-anchor="middle">/dev/sdb1</text>
  <text x="340" y="486" font-size="11" fill="#888" text-anchor="middle">(磁盘/RAID)</text>
  
  <rect x="410" y="440" width="120" height="60" rx="6" fill="#FFFFFF" stroke="#B9B2A3" stroke-width="2"/>
  <text x="470" y="470" font-size="14" font-weight="bold" fill="#555" text-anchor="middle">/dev/sdc1</text>
  <text x="470" y="486" font-size="11" fill="#888" text-anchor="middle">(磁盘/RAID)</text>

  <rect x="540" y="440" width="120" height="60" rx="6" fill="#FFFFFF" stroke="#B9B2A3" stroke-width="2"/>
  <text x="600" y="470" font-size="14" font-weight="bold" fill="#555" text-anchor="middle">/dev/sdd1</text>
  <text x="600" y="486" font-size="11" fill="#888" text-anchor="middle">(磁盘/RAID)</text>


  <!-- ==================== 连线与箭头 ==================== -->

  <!-- 1. PP 到 PV (从下往上，尖端指到 PV 底边 y=380) -->
  <path d="M 340 440 L 340 380" stroke="#3D6FB6" stroke-width="2" marker-end="url(#arr-blue)" fill="none"/>
  <path d="M 470 440 L 470 380" stroke="#3D6FB6" stroke-width="2" marker-end="url(#arr-blue)" fill="none"/>
  <path d="M 600 440 L 600 380" stroke="#3D6FB6" stroke-width="2" marker-end="url(#arr-blue)" fill="none"/>

  <!-- 2. PV 到 VG (从下往上，尖端指到 VG 底边 y=260) -->
  <path d="M 340 320 L 340 260" stroke="#D97757" stroke-width="2" marker-end="url(#arr-orange)" fill="none"/>
  <path d="M 470 320 L 470 260" stroke="#D97757" stroke-width="2" marker-end="url(#arr-orange)" fill="none"/>
  <path d="M 600 320 L 600 260" stroke="#D97757" stroke-width="2" marker-end="url(#arr-orange)" fill="none"/>

  <!-- 3. VG 到 LV (从下往上，尖端指到 LV 底边 y=130) -->
  <path d="M 370 190 L 370 130" stroke="#3A8F5C" stroke-width="2" marker-end="url(#arr-green)" fill="none"/>
  <path d="M 570 190 L 570 130" stroke="#3A8F5C" stroke-width="2" marker-end="url(#arr-green)" fill="none"/>


  <!-- ==================== 动态效果：数据向上流动 ==================== -->
  
  <!-- PP -> PV -->
  <circle r="4" fill="#3D6FB6">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 340 440 L 340 380" />
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.8;0.9;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle r="4" fill="#3D6FB6">
    <animateMotion dur="2s" begin="0.3s" repeatCount="indefinite" path="M 470 440 L 470 380" />
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.8;0.9;1" dur="2s" begin="0.3s" repeatCount="indefinite" />
  </circle>
  <circle r="4" fill="#3D6FB6">
    <animateMotion dur="2s" begin="0.6s" repeatCount="indefinite" path="M 600 440 L 600 380" />
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.8;0.9;1" dur="2s" begin="0.6s" repeatCount="indefinite" />
  </circle>

  <!-- PV -> VG -->
  <circle r="4" fill="#D97757">
    <animateMotion dur="2s" begin="1s" repeatCount="indefinite" path="M 340 320 L 340 260" />
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.8;0.9;1" dur="2s" begin="1s" repeatCount="indefinite" />
  </circle>
  <circle r="4" fill="#D97757">
    <animateMotion dur="2s" begin="1.3s" repeatCount="indefinite" path="M 470 320 L 470 260" />
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.8;0.9;1" dur="2s" begin="1.3s" repeatCount="indefinite" />
  </circle>
  <circle r="4" fill="#D97757">
    <animateMotion dur="2s" begin="1.6s" repeatCount="indefinite" path="M 600 320 L 600 260" />
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.8;0.9;1" dur="2s" begin="1.6s" repeatCount="indefinite" />
  </circle>

  <!-- VG -> LV -->
  <circle r="4" fill="#3A8F5C">
    <animateMotion dur="2s" begin="2s" repeatCount="indefinite" path="M 370 190 L 370 130" />
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.8;0.9;1" dur="2s" begin="2s" repeatCount="indefinite" />
  </circle>
  <circle r="4" fill="#3A8F5C">
    <animateMotion dur="2s" begin="2.3s" repeatCount="indefinite" path="M 570 190 L 570 130" />
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.8;0.9;1" dur="2s" begin="2.3s" repeatCount="indefinite" />
  </circle>

  <!-- 箭头标记定义 -->
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D6FB6"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3A8F5C"/>
    </marker>
  </defs>
</svg>