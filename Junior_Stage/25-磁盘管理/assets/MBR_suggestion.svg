<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <!-- 背景板 -->
  <rect x="1" y="1" width="758" height="248" rx="14" fill="#FBFAF6" stroke="#E5E1D8"/>
  
  <!-- 标题 -->
  <text x="24" y="34" font-size="17" font-weight="bold" fill="#2B2B2B">MBR 分区陷阱：扩展分区必须独占剩余空间</text>
  <text x="24" y="56" font-size="13" fill="#666">MBR 只有 4 个分区表项。若前 3 个为主分区，第 4 个扩展分区必须吃掉所有剩余空间</text>

  <!-- 物理磁盘外框 -->
  <rect x="20" y="80" width="720" height="90" rx="8" fill="#F4EFE6" stroke="#B9B2A3" stroke-width="2"/>
  <text x="380" y="75" font-size="12" fill="#9A9284" text-anchor="middle">物理磁盘 (Physical Disk)</text>

  <!-- 顶部标签 -->
  <text x="50" y="102" font-size="13" fill="#555" text-anchor="middle">MBR</text>
  <text x="120" y="102" font-size="13" fill="#555" text-anchor="middle">Primary</text>
  <text x="210" y="102" font-size="13" fill="#555" text-anchor="middle">Primary</text>
  <text x="300" y="102" font-size="13" fill="#555" text-anchor="middle">Primary</text>
  <text x="540" y="102" font-size="13" fill="#555" text-anchor="middle">Extended (sda4)</text>

  <!-- 固定不变的 3 个主分区 -->
  <g>
    <rect x="30" y="110" width="40" height="50" rx="4" fill="#FFFFFF" stroke="#9A9284" stroke-width="2"/>
    <text x="50" y="140" font-size="14" font-weight="bold" fill="#9A9284" text-anchor="middle">MBR</text>
  </g>
  <g>
    <rect x="80" y="110" width="80" height="50" rx="6" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="2"/>
    <text x="120" y="140" font-size="15" font-weight="bold" fill="#2B2B2B" text-anchor="middle">sda1</text>
  </g>
  <g>
    <rect x="170" y="110" width="80" height="50" rx="6" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="2"/>
    <text x="210" y="140" font-size="15" font-weight="bold" fill="#2B2B2B" text-anchor="middle">sda2</text>
  </g>
  <g>
    <rect x="260" y="110" width="80" height="50" rx="6" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="2"/>
    <text x="300" y="140" font-size="15" font-weight="bold" fill="#2B2B2B" text-anchor="middle">sda3</text>
  </g>

  <!-- ==================== 场景 1：正确做法 ==================== -->
  <g opacity="1">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="8s" repeatCount="indefinite" />
    
    <!-- 扩展分区占满全部剩余空间 -->
    <rect x="350" y="110" width="380" height="50" rx="6" fill="none" stroke="#D97757" stroke-width="2" stroke-dasharray="6 4"/>
    
    <!-- 逻辑分区 sda5 -->
    <rect x="360" y="115" width="90" height="40" rx="4" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="1.5"/>
    <text x="405" y="140" font-size="14" font-weight="bold" fill="#2B2B2B" text-anchor="middle">sda5</text>
    
    <!-- 逻辑分区 sda6 -->
    <rect x="460" y="115" width="90" height="40" rx="4" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="1.5"/>
    <text x="505" y="140" font-size="14" font-weight="bold" fill="#2B2B2B" text-anchor="middle">sda6</text>

    <!-- 逻辑分区未使用空间（扩展内） -->
    <rect x="560" y="115" width="160" height="40" rx="4" fill="#F4EFE6" stroke="#B9B2A3" stroke-width="1.5"/>
    <text x="640" y="140" font-size="13" fill="#9A9284" text-anchor="middle">未使用的逻辑空间</text>
  </g>

  <!-- ==================== 场景 2：错误做法 ==================== -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.95;1" dur="8s" repeatCount="indefinite" />
    
    <!-- 扩展分区只占据了一小部分空间 -->
    <rect x="350" y="110" width="140" height="50" rx="6" fill="none" stroke="#D97757" stroke-width="2" stroke-dasharray="6 4"/>
    
    <!-- 逻辑分区 sda5 -->
    <rect x="360" y="115" width="120" height="40" rx="4" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="1.5"/>
    <text x="420" y="140" font-size="14" font-weight="bold" fill="#2B2B2B" text-anchor="middle">sda5</text>

    <!-- 剩下的永久死区（浪费空间） -->
    <rect x="500" y="110" width="230" height="50" rx="6" fill="#D9D3C7" stroke="#C8463D" stroke-width="2"/>
    <text x="615" y="140" font-size="14" font-weight="bold" fill="#C8463D" text-anchor="middle">永久死区（无法分配）</text>
    
    <!-- 红叉强调 -->
    <g>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
      <path d="M 580 120 L 590 130 M 590 120 L 580 130" stroke="#C8463D" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 640 120 L 650 130 M 650 120 L 640 130" stroke="#C8463D" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ==================== 底部提示文案 ==================== -->
  
  <!-- 正确提示 -->
  <g opacity="1">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="8s" repeatCount="indefinite" />
    <rect x="40" y="195" width="680" height="32" rx="6" fill="#3A8F5C" fill-opacity="0.1"/>
    <text x="380" y="216" font-size="14" font-weight="bold" fill="#3A8F5C" text-anchor="middle">正确做法：第 4 个扩展分区直接吃满剩余的 100% 空间。</text>
  </g>

  <!-- 错误提示 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.95;1" dur="8s" repeatCount="indefinite" />
    <rect x="40" y="195" width="680" height="32" rx="6" fill="#C8463D" fill-opacity="0.1"/>
    <text x="380" y="216" font-size="14" font-weight="bold" fill="#C8463D" text-anchor="middle">严重错误：若扩展分区没吃满，剩余的未分配空间将永远无法被使用。</text>
  </g>
</svg>