<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8578"/>
    </marker>
  </defs>
  <rect x="10" y="10" width="740" height="200" rx="12" fill="#FBFAF6" stroke="#E5E1D8"/>
  <text x="30" y="42" font-size="14" font-weight="bold" fill="#D97757">2. 区段 (Extent) 与 延迟分配</text>

  <rect x="30" y="60" width="150" height="120" rx="8" fill="#FFFFFF" stroke="#8A6BB8" stroke-width="2"/>
  <text x="105" y="85" font-size="13" font-weight="bold" fill="#8A6BB8" text-anchor="middle">内存缓存区</text>

  <circle cx="60" cy="120" r="6" fill="#8A6BB8" opacity="0.6"/>
  <circle cx="90" cy="145" r="6" fill="#8A6BB8" opacity="0.6"/>
  <circle cx="120" cy="110" r="6" fill="#8A6BB8" opacity="0.6"/>
  <circle cx="150" cy="150" r="6" fill="#8A6BB8" opacity="0.6"/>
  <circle cx="140" cy="125" r="6" fill="#8A6BB8" opacity="0.6"/>
  <text x="105" y="170" font-size="11" fill="#666" text-anchor="middle">数据先写入内存</text>

  <path d="M 190 120 L 230 120" stroke="#8A8578" stroke-width="2" marker-end="url(#arr)" fill="none"/>
  <text x="210" y="110" font-size="11" fill="#666" text-anchor="middle">落盘时</text>

  <text x="250" y="55" font-size="13" font-weight="bold" fill="#2B2B2B">底层数据块 (Data Blocks)</text>
  <rect x="240" y="65" width="490" height="115" rx="8" fill="#F4EFE6" stroke="#D9D3C7" stroke-width="2"/>

  <rect x="260" y="90" width="300" height="60" rx="6" fill="#D97757" stroke="#B35C3E" stroke-width="1.5"/>
  <text x="410" y="115" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Extent (连续区段: 起始块 + 长度)</text>
  <text x="410" y="135" font-size="12" fill="#FFFFFF" opacity="0.9" text-anchor="middle">延迟分配：系统一次性划分大片连续物理空间</text>

  <rect x="580" y="90" width="60" height="60" rx="6" fill="#B9B2A3" fill-opacity="0.3" stroke="#B9B2A3" stroke-width="1"/>
  <text x="610" y="125" font-size="12" fill="#666" text-anchor="middle">已占用</text>
  <rect x="650" y="90" width="60" height="60" rx="6" fill="#B9B2A3" fill-opacity="0.3" stroke="#B9B2A3" stroke-width="1"/>
  <text x="680" y="125" font-size="12" fill="#666" text-anchor="middle">已占用</text>

  <g>
    <circle r="4" fill="#8A6BB8">
      <animate attributeName="cx" values="60;105;260;410;410" keyTimes="0;0.2;0.4;0.6;1" dur="4s" repeatCount="indefinite" />
      <animate attributeName="cy" values="120;120;120;120;120" keyTimes="0;0.2;0.4;0.6;1" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;1;1;0;0" keyTimes="0;0.4;0.6;0.7;1" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle r="4" fill="#8A6BB8">
      <animate attributeName="cx" values="150;105;260;410;410" keyTimes="0;0.2;0.4;0.6;1" dur="4s" begin="0.5s" repeatCount="indefinite" />
      <animate attributeName="cy" values="150;120;120;120;120" keyTimes="0;0.2;0.4;0.6;1" dur="4s" begin="0.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;1;1;0;0" keyTimes="0;0.4;0.6;0.7;1" dur="4s" begin="0.5s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
