<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <!-- 背景板（边界收缩） -->
  <rect x="1" y="1" width="758" height="218" rx="14" fill="#FBFAF6" stroke="#E5E1D8"/>
  
  <!-- 标题 -->
  <text x="24" y="34" font-size="17" font-weight="bold" fill="#2B2B2B">MBR 分区方案：3 个主分区 + 1 个扩展分区</text>
  <text x="24" y="56" font-size="13" fill="#666">将第 4 个分区设为扩展分区，可在其中动态划分多个逻辑分区</text>

  <!-- 物理磁盘外框（整体下移） -->
  <rect x="20" y="80" width="720" height="90" rx="8" fill="#F4EFE6" stroke="#B9B2A3" stroke-width="2"/>
  <text x="380" y="75" font-size="12" fill="#9A9284" text-anchor="middle">物理磁盘 (Physical Disk)</text>

  <!-- 顶部标签（严格居中对齐） -->
  <text x="55" y="102" font-size="13" fill="#555" text-anchor="middle">MBR</text>
  <text x="135" y="102" font-size="13" fill="#555" text-anchor="middle">Primary</text>
  <text x="235" y="102" font-size="13" fill="#555" text-anchor="middle">Primary</text>
  <text x="335" y="102" font-size="13" fill="#555" text-anchor="middle">Primary</text>
  <text x="540" y="102" font-size="13" fill="#555" text-anchor="middle">Extended (sda4)</text>

  <!-- 1. MBR -->
  <g>
    <rect x="30" y="110" width="50" height="50" rx="6" fill="#FFFFFF" stroke="#9A9284" stroke-width="2"/>
    <text x="55" y="140" font-size="14" font-weight="bold" fill="#9A9284" text-anchor="middle">MBR</text>
  </g>

  <!-- 2. sda1 -->
  <g>
    <rect x="90" y="110" width="90" height="50" rx="6" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="2"/>
    <text x="135" y="140" font-size="15" font-weight="bold" fill="#2B2B2B" text-anchor="middle">sda1</text>
    <rect x="90" y="110" width="90" height="50" rx="6" fill="#3D6FB6" opacity="0">
      <animate attributeName="opacity" values="0;0;0.15;0;0;0;0" keyTimes="0;0.1;0.15;0.2;0.3;0.4;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 3. sda2 -->
  <g>
    <rect x="190" y="110" width="90" height="50" rx="6" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="2"/>
    <text x="235" y="140" font-size="15" font-weight="bold" fill="#2B2B2B" text-anchor="middle">sda2</text>
    <rect x="190" y="110" width="90" height="50" rx="6" fill="#3D6FB6" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0.15;0;0" keyTimes="0;0.15;0.2;0.25;0.3;0.35;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 4. sda3 -->
  <g>
    <rect x="290" y="110" width="90" height="50" rx="6" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="2"/>
    <text x="335" y="140" font-size="15" font-weight="bold" fill="#2B2B2B" text-anchor="middle">sda3</text>
    <rect x="290" y="110" width="90" height="50" rx="6" fill="#3D6FB6" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0;0.15;0" keyTimes="0;0.2;0.25;0.3;0.35;0.4;0.45" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 5. 扩展分区（大框） -->
  <g>
    <rect x="390" y="110" width="300" height="50" rx="6" fill="none" stroke="#D97757" stroke-width="2" stroke-dasharray="6 4"/>
    
    <!-- 逻辑分区动态生成动画 -->
    
    <!-- sda5 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0;1;1" keyTimes="0;0.3;0.4;0.45;0.5;0.55;1" dur="6s" repeatCount="indefinite"/>
      <rect x="398" y="115" width="80" height="40" rx="4" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="1.5"/>
      <text x="438" y="140" font-size="14" font-weight="bold" fill="#2B2B2B" text-anchor="middle">sda5</text>
    </g>

    <!-- sda6 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0;0;1;1" keyTimes="0;0.35;0.45;0.5;0.55;0.6;0.65;1" dur="6s" repeatCount="indefinite"/>
      <rect x="486" y="115" width="80" height="40" rx="4" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="1.5"/>
      <text x="526" y="140" font-size="14" font-weight="bold" fill="#2B2B2B" text-anchor="middle">sda6</text>
    </g>

    <!-- sda7 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0;0;0;1;1" keyTimes="0;0.4;0.5;0.55;0.6;0.65;0.7;0.75;1" dur="6s" repeatCount="indefinite"/>
      <rect x="574" y="115" width="106" height="40" rx="4" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="1.5"/>
      <text x="627" y="140" font-size="14" font-weight="bold" fill="#2B2B2B" text-anchor="middle">sda7</text>
    </g>
  </g>
</svg>