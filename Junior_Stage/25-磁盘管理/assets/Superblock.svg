<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <rect x="10" y="10" width="740" height="180" rx="12" fill="#FBFAF6" stroke="#E5E1D8"/>
  <text x="30" y="42" font-size="14" font-weight="bold" fill="#3A8F5C">3. Superblock (超级块) 的稀疏备份</text>

  <rect x="30" y="55" width="700" height="120" rx="10" fill="none" stroke="#9A9284" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="75" font-size="12" fill="#9A9284">块组序列</text>

  <rect x="50" y="82" width="90" height="60" rx="6" fill="#FFFFFF" stroke="#3A8F5C" stroke-width="2"/>
  <text x="95" y="102" font-size="13" fill="#2B2B2B" text-anchor="middle">Group 0</text>
  <rect x="60" y="114" width="70" height="22" rx="4" fill="#D97757"/>
  <text x="95" y="130" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">主超块</text>

  <rect x="160" y="82" width="90" height="60" rx="6" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1.5"/>
  <text x="205" y="102" font-size="13" fill="#2B2B2B" text-anchor="middle">Group 1</text>
  <rect x="170" y="114" width="70" height="22" rx="4" fill="#D97757" fill-opacity="0.4" stroke="#D97757" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="205" y="130" font-size="11" font-weight="bold" fill="#D97757" text-anchor="middle">备份超块</text>

  <rect x="270" y="82" width="90" height="60" rx="6" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1.5"/>
  <text x="315" y="102" font-size="13" fill="#2B2B2B" text-anchor="middle">Group 2</text>
  <text x="315" y="130" font-size="12" fill="#9A9284" text-anchor="middle">(无备份)</text>

  <rect x="380" y="82" width="90" height="60" rx="6" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1.5"/>
  <text x="425" y="102" font-size="13" fill="#2B2B2B" text-anchor="middle">Group 3</text>
  <rect x="390" y="114" width="70" height="22" rx="4" fill="#D97757" fill-opacity="0.4" stroke="#D97757" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="425" y="130" font-size="11" font-weight="bold" fill="#D97757" text-anchor="middle">备份超块</text>

  <rect x="490" y="82" width="90" height="60" rx="6" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1.5"/>
  <text x="535" y="102" font-size="13" fill="#2B2B2B" text-anchor="middle">Group 5</text>
  <rect x="500" y="114" width="70" height="22" rx="4" fill="#D97757" fill-opacity="0.4" stroke="#D97757" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="535" y="130" font-size="11" font-weight="bold" fill="#D97757" text-anchor="middle">备份超块</text>

  <text x="610" y="110" font-size="20" font-weight="bold" fill="#9A9284" text-anchor="middle">...</text>

  <rect x="630" y="82" width="90" height="60" rx="6" fill="#FFFFFF" stroke="#D9D3C7" stroke-width="1.5"/>
  <text x="675" y="102" font-size="13" fill="#2B2B2B" text-anchor="middle">Group N</text>
  <rect x="640" y="114" width="70" height="22" rx="4" fill="#D97757" fill-opacity="0.4" stroke="#D97757" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="675" y="130" font-size="11" font-weight="bold" fill="#D97757" text-anchor="middle">备份超块</text>

  <text x="380" y="162" font-size="12" fill="#666" text-anchor="middle">备份超级块按质数/平方数规律分布（如 1, 3, 5, 7, 9, 25 等）。若主超级块损坏，可指定备份超块救援。</text>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.5;0.9;1" dur="6s" repeatCount="indefinite" />
    <path d="M 70 122 L 120 142 M 120 122 L 70 142" stroke="#C8463D" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="170" y="114" width="70" height="22" rx="4" fill="none" stroke="#3A8F5C" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.4;0.5;0.6;0.9;1" dur="6s" repeatCount="indefinite" />
    </rect>
    <rect x="390" y="114" width="70" height="22" rx="4" fill="none" stroke="#3A8F5C" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.4;0.5;0.6;0.9;1" dur="6s" repeatCount="indefinite" />
    </rect>
    <rect x="500" y="114" width="70" height="22" rx="4" fill="none" stroke="#3A8F5C" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.4;0.5;0.6;0.9;1" dur="6s" repeatCount="indefinite" />
    </rect>
    <rect x="640" y="114" width="70" height="22" rx="4" fill="none" stroke="#3A8F5C" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.4;0.5;0.6;0.9;1" dur="6s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
