<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <!-- 背景板（边界收缩） -->
  <rect x="1" y="1" width="758" height="228" rx="14" fill="#FBFAF6" stroke="#E5E1D8"/>
  
  <!-- 标题 -->
  <text x="24" y="34" font-size="17" font-weight="bold" fill="#2B2B2B">MBR 分区方案：4 个主分区</text>
  <text x="24" y="56" font-size="13" fill="#666">主分区最多只能有 4 个，全部分配完毕后无法继续划分</text>

  <!-- 物理磁盘外框（整体下移） -->
  <rect x="20" y="80" width="720" height="90" rx="8" fill="#F4EFE6" stroke="#B9B2A3" stroke-width="2"/>
  <text x="380" y="75" font-size="12" fill="#9A9284" text-anchor="middle">物理磁盘 (Physical Disk)</text>

  <!-- 顶部标签（严格居中对齐） -->
  <text x="55" y="102" font-size="13" fill="#555" text-anchor="middle">MBR</text>
  <text x="160" y="102" font-size="13" fill="#555" text-anchor="middle">Primary</text>
  <text x="310" y="102" font-size="13" fill="#555" text-anchor="middle">Primary</text>
  <text x="460" y="102" font-size="13" fill="#555" text-anchor="middle">Primary</text>
  <text x="610" y="102" font-size="13" fill="#555" text-anchor="middle">Primary</text>

  <!-- 1. MBR -->
  <g>
    <rect x="30" y="110" width="50" height="50" rx="6" fill="#FFFFFF" stroke="#9A9284" stroke-width="2"/>
    <text x="55" y="140" font-size="14" font-weight="bold" fill="#9A9284" text-anchor="middle">MBR</text>
  </g>

  <!-- 2. sda1 -->
  <g>
    <rect x="90" y="110" width="140" height="50" rx="6" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="2"/>
    <text x="160" y="140" font-size="15" font-weight="bold" fill="#2B2B2B" text-anchor="middle">sda1</text>
    <rect x="90" y="110" width="140" height="50" rx="6" fill="#3D6FB6" opacity="0">
      <animate attributeName="opacity" values="0;0;0.15;0;0;0;0;0" keyTimes="0;0.1;0.15;0.2;0.4;0.6;0.8;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 3. sda2 -->
  <g>
    <rect x="240" y="110" width="140" height="50" rx="6" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="2"/>
    <text x="310" y="140" font-size="15" font-weight="bold" fill="#2B2B2B" text-anchor="middle">sda2</text>
    <rect x="240" y="110" width="140" height="50" rx="6" fill="#3D6FB6" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0.15;0;0;0" keyTimes="0;0.2;0.25;0.3;0.35;0.4;0.6;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 4. sda3 -->
  <g>
    <rect x="390" y="110" width="140" height="50" rx="6" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="2"/>
    <text x="460" y="140" font-size="15" font-weight="bold" fill="#2B2B2B" text-anchor="middle">sda3</text>
    <rect x="390" y="110" width="140" height="50" rx="6" fill="#3D6FB6" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0;0.15;0;0" keyTimes="0;0.3;0.35;0.4;0.45;0.5;0.55;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 5. sda4 -->
  <g>
    <rect x="540" y="110" width="140" height="50" rx="6" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="2"/>
    <text x="610" y="140" font-size="15" font-weight="bold" fill="#2B2B2B" text-anchor="middle">sda4</text>
    <rect x="540" y="110" width="140" height="50" rx="6" fill="#3D6FB6" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0;0;0;0.15;0;0" keyTimes="0;0.4;0.45;0.5;0.55;0.6;0.65;0.7;0.75;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 无法继续划分的警告提示 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" keyTimes="0;0.5;0.6;0.65;0.7;0.75;0.8;0.95;1" dur="6s" repeatCount="indefinite"/>
    <rect x="210" y="185" width="340" height="30" rx="6" fill="#C8463D" fill-opacity="0.1" stroke="#C8463D" stroke-width="1.5"/>
    <text x="380" y="205" font-size="14" font-weight="bold" fill="#C8463D" text-anchor="middle">已达到上限！无法再划分第 5 个主分区</text>
    <path d="M 610 160 L 610 175" stroke="#C8463D" stroke-width="2" stroke-dasharray="4 2"/>
    <circle cx="610" cy="180" r="3" fill="#C8463D"/>
  </g>
</svg>